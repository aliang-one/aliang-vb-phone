name: Release APK

# Push a tag on main (e.g. `git tag v1.0.1 && git push github v1.0.1`) to build
# an installable Android APK. Release assets: the raw APK + (release-signed
# builds only) the download-center zip bundle (aliang-android-<tag>.zip /
# aliang-android-latest.zip, inner file neutral-named app-arm64.bin — COS 拦
# .apk 直链，官网走 zip + 网页内解压) + SHA256SUMS. Everything is attached to
# the GitHub Release for the tag; the cos-phone-release-sync relay in the
# cluster mirrors release assets to 腾讯云 COS every 5 minutes. The APK is
# also uploaded as a workflow artifact.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release and upload the APK to it

jobs:
  android-apk:
    name: Android APK (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tag-on-main guard needs origin/main history

      - name: Ensure the tag points at a commit on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main — release builds only run for main tags."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Install JS dependencies
        run: npm ci

      # Signing: with ALIANG_RELEASE_KEYSTORE_BASE64 (+ the three other
      # ALIANG_RELEASE_* secrets) the APK gets a production signature. Without
      # them we build a debug-signed internal APK instead of failing — it is
      # clearly labelled and must not be distributed as a production update.
      - name: Prepare signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ALIANG_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "No ALIANG_RELEASE_KEYSTORE_BASE64 secret — building a debug-signed internal APK."
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK (arm64-v8a)
        env:
          VERSION_NAME: ${{ github.ref_name }} # e.g. v1.0.1
          VERSION_CODE: ${{ github.run_number }} # monotonic, enables update-installs
          ALIANG_RELEASE_STORE_PASSWORD: ${{ secrets.ALIANG_RELEASE_STORE_PASSWORD }}
          ALIANG_RELEASE_KEY_ALIAS: ${{ secrets.ALIANG_RELEASE_KEY_ALIAS }}
          ALIANG_RELEASE_KEY_PASSWORD: ${{ secrets.ALIANG_RELEASE_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            export ALIANG_RELEASE_STORE_FILE="$RUNNER_TEMP/release.keystore"
          else
            # No keystore — do NOT set STORE_FILE (gradle treats a lone store
            # path as partially-configured signing and fails the build).
            export ALLOW_DEBUG_RELEASE_SIGNING=true
          fi
          npm run android:release

      - name: Collect APK
        id: apk
        run: |
          SUFFIX=""
          if [ "${{ steps.signing.outputs.mode }}" != "release" ]; then
            SUFFIX="-debug-signed"
          fi
          NAME="aliang-${GITHUB_REF_NAME}-arm64${SUFFIX}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # 下载中心 zip 包：内部文件名刻意中性化（app-arm64.bin）——COS 的 APK
      # 拦截按扩展名/Content-Type 工作，zip 内容不经解压不会被嗅探；用户侧
      # 由官网 /download 页 fetch→解压→Blob 指定 .apk 文件名，zip 内部叫什么
      # 不影响落盘名。仅正式签名出 zip（debug 签名绝不能进分发渠道）；固定
      # 名 aliang-android-latest.zip 让官网条目的 URL 一次填写、永不随版本变。
      # SHA256SUMS 无论签名模式都生成——cos-phone-release-sync 中继以它为
      # 资产清单（缺失会让定时搬运每 5 分钟报一次错）。
      - name: Package download-center bundle (zip + SHA256SUMS)
        id: bundle
        env:
          APK_NAME: ${{ steps.apk.outputs.name }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir zip-stage
          cp "android/app/build/outputs/apk/release/app-release.apk" zip-stage/app-arm64.bin
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            (cd zip-stage \
              && zip -q "../aliang-android-${TAG}.zip" app-arm64.bin \
              && zip -q "../aliang-android-latest.zip" app-arm64.bin)
            echo "zip_tagged=aliang-android-${TAG}.zip" >> "$GITHUB_OUTPUT"
            echo "zip_latest=aliang-android-latest.zip" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::debug-signed build — download-center zip bundle skipped (debug signatures must not reach the download center)"
          fi
          sha256sum "$APK_NAME" > SHA256SUMS
          if [ -f "aliang-android-${TAG}.zip" ]; then
            sha256sum "aliang-android-${TAG}.zip" "aliang-android-latest.zip" >> SHA256SUMS
          fi
          cat SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Attach assets to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
          # zip 产物仅在正式签名模式存在（bundle 步骤被跳过时 outputs 为空），
          # 按条件拼装上传清单，避免空参数打断 gh release upload。
          FILES=("${{ steps.apk.outputs.name }}" SHA256SUMS)
          if [ -n "${{ steps.bundle.outputs.zip_tagged }}" ]; then
            FILES+=("${{ steps.bundle.outputs.zip_tagged }}" "${{ steps.bundle.outputs.zip_latest }}")
          fi
          gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber
