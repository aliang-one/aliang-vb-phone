name: Release APK

# Push a tag on main (e.g. `git tag v1.0.1 && git push github v1.0.1`) to build
# an installable Android APK. It is attached to a GitHub Release for the tag
# and also uploaded as a workflow artifact.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release and upload the APK to it

jobs:
  android-apk:
    name: Android APK (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tag-on-main guard needs origin/main history

      - name: Ensure the tag points at a commit on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main — release builds only run for main tags."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Install JS dependencies
        run: npm ci

      # Signing: with ALIANG_RELEASE_KEYSTORE_BASE64 (+ the three other
      # ALIANG_RELEASE_* secrets) the APK gets a production signature. Without
      # them we build a debug-signed internal APK instead of failing — it is
      # clearly labelled and must not be distributed as a production update.
      - name: Prepare signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ALIANG_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "No ALIANG_RELEASE_KEYSTORE_BASE64 secret — building a debug-signed internal APK."
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK (arm64-v8a)
        env:
          VERSION_NAME: ${{ github.ref_name }} # e.g. v1.0.1
          VERSION_CODE: ${{ github.run_number }} # monotonic, enables update-installs
          ALIANG_RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          ALIANG_RELEASE_STORE_PASSWORD: ${{ secrets.ALIANG_RELEASE_STORE_PASSWORD }}
          ALIANG_RELEASE_KEY_ALIAS: ${{ secrets.ALIANG_RELEASE_KEY_ALIAS }}
          ALIANG_RELEASE_KEY_PASSWORD: ${{ secrets.ALIANG_RELEASE_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.mode }}" != "release" ]; then
            export ALLOW_DEBUG_RELEASE_SIGNING=true
          fi
          npm run android:release

      - name: Collect APK
        id: apk
        run: |
          SUFFIX=""
          if [ "${{ steps.signing.outputs.mode }}" != "release" ]; then
            SUFFIX="-debug-signed"
          fi
          NAME="aliang-${GITHUB_REF_NAME}-arm64${SUFFIX}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Attach APK to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" "${{ steps.apk.outputs.name }}" \
            --repo "$GITHUB_REPOSITORY" --clobber
