<!DOCTYPE html>

<html class="light" lang="en"><head>

                    "on-secondary": "#ffffff",
                    "surface-container-high": "#e5e8ef",
                    "inverse-surface": "#2d3136",
                    "surface-tint": "#005bc0",
                    "outline-variant": "#c2c6d6",
                    "secondary-container": "#dae3ef",
                    "primary-fixed": "#d8e2ff",
                    "on-tertiary-container": "#e8f1fa",

                    "tertiary-container": "#656e76",

                    "gutter": "16px",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface dark:bg-on-background text-on-surface dark:text-inverse-on-surface min-h-screen flex flex-col items-center justify-center p-md">
<!-- Brand Header -->
<header class="mb-xl flex flex-col items-center">
<div class="mb-md text-on-background dark:text-on-primary-container">
<span class="material-symbols-outlined text-[48px]" data-icon="terminal">terminal</span>
</div>
<h1 class="font-h1 text-h1 tracking-tight text-center">Secure Auth Gateway</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Access the Command Center infrastructure.</p>
</header>
<!-- Login Form Card -->
<main class="w-full max-w-[340px]">
<div class="bg-surface-container-lowest dark:bg-on-secondary-fixed-variant border border-outline-variant dark:border-outline rounded-lg p-lg shadow-sm">
<form class="flex flex-col gap-md">
<!-- Agent ID Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md" for="agent_id">Agent ID</label>
<div class="relative">
<input class="w-full font-code-md text-code-md bg-surface dark:bg-on-background border border-outline-variant dark:border-outline rounded-lg px-md py-sm focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200 outline-none placeholder:text-on-surface-variant/50" id="agent_id" placeholder="AGNT-0000" type="text"/>
</div>
</div>
<!-- Access Key Input -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md" for="access_key">Access Key</label>
</div>
<input class="w-full font-body-md text-body-md bg-surface dark:bg-on-background border border-outline-variant dark:border-outline rounded-lg px-md py-sm focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200 outline-none placeholder:text-on-surface-variant/50" id="access_key" placeholder="••••••••" type="password"/>
<div class="flex justify-end mt-xs">
<a class="font-body-sm text-body-sm text-primary dark:text-primary-fixed-dim hover:underline transition-all" href="#">Forgot Key</a>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md py-sm rounded-lg transition-colors duration-200 mt-xs flex justify-center items-center gap-xs" type="submit">
                    Sign In
                </button>
</form>
</div>
<!-- Biometric Link & Additional Actions -->
<div class="mt-lg border border-outline-variant dark:border-outline rounded-lg p-md flex flex-col items-center gap-sm">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]" data-icon="fingerprint">fingerprint</span>
<a class="font-body-md text-body-md text-primary dark:text-primary-fixed-dim hover:underline" href="#">Biometric Link</a>
</div>
</div>
<div class="mt-xl flex flex-wrap justify-center gap-md text-center opacity-60">
<a class="font-body-sm text-body-sm hover:text-primary transition-colors" href="#">Terms</a>
<a class="font-body-sm text-body-sm hover:text-primary transition-colors" href="#">Privacy</a>
<a class="font-body-sm text-body-sm hover:text-primary transition-colors" href="#">Security</a>
<a class="font-body-sm text-body-sm hover:text-primary transition-colors" href="#">Contact Support</a>
</div>
</main>
<!-- Visual Polish / Background Decoration (Hidden on mobile for focus) -->
<div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden opacity-50 dark:opacity-20 hidden md:block">
<div class="absolute top-0 right-0 w-[500px] h-[500px] bg-gradient-to-br from-primary/5 to-transparent rounded-full -translate-y-1/2 translate-x-1/2 blur-3xl"></div>
<div class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-gradient-to-tr from-secondary/5 to-transparent rounded-full translate-y-1/2 -translate-x-1/2 blur-3xl"></div>
</div>
<!-- Decorative Illustration Card (Asymmetric Bento Element) -->
<div class="hidden lg:flex fixed top-md right-md bottom-md w-1/4 max-w-sm flex-col gap-md">
<div class="flex-1 border border-outline-variant dark:border-outline rounded-xl overflow-hidden relative bg-surface-container">
<img class="w-full h-full object-cover grayscale contrast-125 mix-blend-overlay" data-alt="A clean top-down view of high-end server racks in a darkened room, illuminated by sharp blue and white LED indicators. The aesthetic is extremely minimalist and technical, using deep blacks and metallic grays to convey high-security data infrastructure. The lighting is cold and atmospheric, suggesting a state-of-the-art secure facility." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCUYjZrK_VfD1QQ4ITw55PpKDx2mY4DdypfUz26T6gLlWMDbUr_1nxjDALkk-NPeTWZzyya2yek_6vt1snMP0SB-HyJmH7ljAp41lvdkvWN_L5HV58L32Psg9YWI-1uHGgckn-hLMq_NsfSBSfLBOQNtJ_tvwk3ACp7zbShwPNp5evH366Rv_jxsV5lxH5HthXNlPr015l5jU7zxRJpn77kj3WrrKSoRmNvQZmIzSDJtV2iEtQoDDxpGShjlSEPlBWVQLtfHBhjdWk"/>
<div class="absolute inset-0 p-lg flex flex-col justify-end bg-gradient-to-t from-background/90 to-transparent">
<p class="font-code-md text-body-sm uppercase tracking-widest text-primary mb-xs">Status</p>
<p class="font-h3 text-h3">Network Secure</p>
</div>
</div>
<div class="h-1/3 border border-outline-variant dark:border-outline rounded-xl p-lg bg-surface-container-low flex flex-col justify-between">
<span class="material-symbols-outlined text-primary text-[32px]" data-icon="shield_lock" data-weight="fill" style="font-variation-settings: 'FILL' 1;">shield_lock</span>
<div>
<p class="font-label-md text-label-md mb-xs">End-to-End Encryption</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">All sessions are audited and encrypted using quantum-resistant protocols.</p>
</div>
</div>
</div>
</body></html>
