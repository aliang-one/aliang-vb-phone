<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=JetBrains+Mono:wght@400;700&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

          darkMode: "class",

            extend: {
              "colors": {
                      "on-secondary-fixed": "#002113",

                      "surface-tint": "#00e639",
                      "tertiary-container": "#ffd5ae",
                      "surface-container-high": "#222d20",
                      "on-tertiary-container": "#7a5b3c",
                      "surface-container-highest": "#2d382a",
                      "on-tertiary-fixed": "#2c1701",
                      "on-tertiary": "#442b10",
                      "on-primary-fixed": "#002203",
                      "surface-container": "#182216",
                      "on-background": "#dae6d2",
                      "on-primary-container": "#007117",
                      "outline": "#84967e",
                      "primary": "#ebffe2",
                      "tertiary-fixed-dim": "#e7bf99",
                      "primary-container": "#00ff41",
                      "inverse-surface": "#dae6d2",
                      "surface-container-lowest": "#071106",
                      "secondary-fixed-dim": "#4edea3",
                      "tertiary-fixed": "#ffdcbd",
                      "secondary-fixed": "#6ffbbe",

                      "on-error": "#690005",
                      "on-secondary": "#003824",
                      "surface-variant": "#2d382a",
                      "primary-fixed-dim": "#00e639",
                      "on-secondary-fixed-variant": "#005236",
                      "inverse-on-surface": "#283326",
                      "surface-dim": "#0c160a",
                      "surface-bright": "#313c2e",
                      "secondary-container": "#00a572",
                      "error": "#ffb4ab",
                      "on-primary": "#003907",
                      "surface": "#0c160a",
                      "background": "#0c160a",
                      "secondary": "#4edea3",
                      "on-secondary-container": "#00311f",
                      "inverse-primary": "#006e16",
                      "on-error-container": "#ffdad6"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",

              },
              "spacing": {
                      "container-max": "1440px",
                      "section-gap": "48px",
                      "gutter": "16px",
                      "unit": "4px",
                      "margin": "24px"
              },
              "fontFamily": {
                      "label-caps": ["Inter"],
                      "data-mono": ["JetBrains Mono"],
                      "display": ["Space Grotesk"],
                      "terminal-sm": ["JetBrains Mono"],
                      "body-lg": ["Inter"],
                      "headline-md": ["Space Grotesk"]
              },
              "fontSize": {
                      "label-caps": ["12px", {"lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "600"}],
                      "data-mono": ["14px", {"lineHeight": "1.5", "fontWeight": "450"}],
                      "display": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],

            },
          },
        }

<style>
        .grid-bg {
            background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .scanline {
            background: linear-gradient(to bottom, transparent 0%, rgba(0, 255, 65, 0.05) 50%, transparent 100%);
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        .glow-border:focus-within {
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
            border-color: #00ff41;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-lg selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Background Layer -->
<div class="fixed inset-0 grid-bg z-0"></div>
<div class="fixed inset-0 bg-gradient-to-tr from-surface-container-lowest via-transparent to-transparent opacity-60 z-0"></div>
<!-- Top Bar Component -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 h-12 bg-[#0B0E11]/80 backdrop-blur-xl border-b border-white/10">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#00D1FF]" data-icon="terminal">terminal</span>
<span class="font-mono font-black text-[#00D1FF] tracking-widest text-sm">PLATFORM_LOGIN</span>
</div>
<div class="h-8 w-8 bg-surface-container-highest border border-white/10 rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-[#00D1FF] text-lg" data-icon="shield">shield</span>
</div>
</header>
<!-- Main Authentication Portal -->
<main class="relative z-10 w-full max-w-md px-6 py-12 flex flex-col gap-8">
<!-- Schematic Header -->
<div class="flex flex-col items-start gap-2 border-l-2 border-primary-container pl-6 py-2">
<div class="flex items-center gap-3">
<div class="w-2 h-2 bg-primary-container"></div>
<h1 class="font-display text-headline-md text-primary-container uppercase tracking-tight">PLATFORM_SESSION</h1>
</div>
<p class="font-terminal-sm text-on-surface-variant opacity-70">USER LOGIN // DEVICES / PROJECTS / AGENTS</p>
</div>
<!-- Glassmorphism Card -->
<div class="bg-surface-container/70 backdrop-blur-xl border border-outline-variant p-8 rounded-lg relative overflow-hidden">
<div class="scanline"></div>
<form class="flex flex-col gap-6">
<!-- Platform user email input -->
<div class="flex flex-col gap-2 group">
<label class="font-label-caps text-on-surface-variant">USER_EMAIL</label>
<div class="flex items-center bg-surface-container-lowest border border-outline-variant px-4 py-3 glow-border transition-all duration-300">
<span class="font-data-mono text-primary-container mr-3">&gt;</span>
<input class="bg-transparent border-none p-0 focus:ring-0 w-full font-data-mono text-on-surface placeholder:text-outline-variant" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Platform password input -->
<div class="flex flex-col gap-2 group">
<label class="font-label-caps text-on-surface-variant">PASSWORD</label>
<div class="flex items-center bg-surface-container-lowest border border-outline-variant px-4 py-3 glow-border transition-all duration-300">
<span class="font-data-mono text-primary-container mr-3">&gt;</span>
<input class="bg-transparent border-none p-0 focus:ring-0 w-full font-data-mono text-on-surface placeholder:text-outline-variant" placeholder="输入平台密码" type="password"/>
</div>
</div>
<!-- Login Button -->
<div class="pt-4">
<button class="w-full bg-primary-container hover:bg-surface-tint text-on-primary-container font-label-caps py-4 rounded-[2px] transition-all duration-300 active:scale-[0.98] relative overflow-hidden group shadow-[0_0_20px_rgba(0,255,65,0.2)]" type="submit">
<span class="relative z-10">登录平台</span>
<!-- Scanner Glow Effect -->
<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-[-100%] transition-transform duration-700 ease-in-out"></div>
</button>
</div>
</form>
<!-- Bottom Options -->
<div class="mt-8 pt-6 border-t border-outline-variant/30 flex justify-between items-center">
<button class="font-terminal-sm text-on-surface-variant hover:text-primary-fixed transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-[14px]" data-icon="fingerprint">fingerprint</span>
                    BIOMETRIC_LINK
                </button>
<button class="font-terminal-sm text-on-surface-variant hover:text-primary-fixed transition-colors">
                    FORGOT_KEY
                </button>
</div>
</div>
<!-- Technical Metadata -->
<div class="grid grid-cols-2 gap-4">
<div class="bg-surface-container-low border border-outline-variant p-3 flex flex-col gap-1">
<span class="font-label-caps text-[8px] text-on-surface-variant">NODE_LOCATION</span>
<span class="font-data-mono text-terminal-sm text-on-surface">LOC_ID: 192.168.0.1</span>
</div>
<div class="bg-surface-container-low border border-outline-variant p-3 flex flex-col gap-1">
<span class="font-label-caps text-[8px] text-on-surface-variant">PROTO_STAMP</span>
<span class="font-data-mono text-terminal-sm text-on-surface">VER: 0.8.4-BETA</span>
</div>
</div>
</main>
<!-- Visual Accents: Schematics Image -->
<div class="fixed bottom-0 right-0 w-1/3 h-1/2 opacity-10 pointer-events-none mix-blend-screen z-0">
<img class="w-full h-full object-contain filter invert grayscale" data-alt="A highly detailed blueprint schematic of a complex neural network processor core. The image shows intricate circuits, geometric lines, and technical data labels in a minimalist digital architectural style. The palette is strictly deep blacks and faint glowing green lines, creating a sophisticated futuristic engineering aesthetic that feels like a high-end holographic projection in a dark room." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC_C6dGrU8JVl2JZjPiGSNa0k0SWty3kedifX7TadrLqh8zA4FRBsUNAThAQm8mk2rZ5Z7btko2KRZhxLUDdbq90POegsFyf8OhbWobm9wv7MOtKShzjVbMzbPoXkC7RSzLO4R_l0nfT87Tl-K5PPY_20FjG763YK8LlmcO4xceeuchVAqX31IAxekipUWV5iT9WNRcJkSY3ZSzih3BUrB_QeyRcppkNDKHtsSl56SbUkJ1JK8xF136Oc0hTTdyWU6ziefRY4Ho4ew"/>
</div>
<!-- Bottom Nav Bar Component -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pb-safe h-16 bg-[#0B0E11]/90 backdrop-blur-lg border-t border-white/10">
<div class="flex flex-col items-center justify-center text-gray-500 pt-2 pb-1 hover:text-white transition-all cursor-pointer">
<span class="material-symbols-outlined" data-icon="folder_open">folder_open</span>
<span class="font-mono text-[10px] tracking-tight">PROJECTS</span>
</div>
<div class="flex flex-col items-center justify-center text-[#00D1FF] border-t-2 border-[#00D1FF] pt-2 pb-1 bg-gradient-to-b from-[#00D1FF]/10 to-transparent cursor-pointer">
<span class="material-symbols-outlined" data-icon="terminal">terminal</span>
<span class="font-mono text-[10px] tracking-tight">TERMINALS</span>
</div>
<div class="flex flex-col items-center justify-center text-gray-500 pt-2 pb-1 hover:text-white transition-all cursor-pointer">
<span class="material-symbols-outlined" data-icon="settings_input_component">settings_input_component</span>
<span class="font-mono text-[10px] tracking-tight">SETTINGS</span>
</div>
</nav>
<!-- Global Layout Frame Corners -->
<div class="fixed top-4 left-4 w-4 h-4 border-t border-l border-primary-container z-50"></div>
<div class="fixed top-4 right-4 w-4 h-4 border-t border-r border-primary-container z-50"></div>
<div class="fixed bottom-20 left-4 w-4 h-4 border-b border-l border-primary-container z-50"></div>
<div class="fixed bottom-20 right-4 w-4 h-4 border-b border-r border-primary-container z-50"></div>
</body></html>
