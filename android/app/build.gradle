apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def releaseSigningValue = { String name ->
    def propertyValue = project.findProperty(name)?.toString()?.trim()
    propertyValue ?: System.getenv(name)?.trim()
}
def releaseStoreFilePath = releaseSigningValue('ALIANG_RELEASE_STORE_FILE')
def releaseStorePassword = releaseSigningValue('ALIANG_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = releaseSigningValue('ALIANG_RELEASE_KEY_ALIAS')
def releaseKeyPassword = releaseSigningValue('ALIANG_RELEASE_KEY_PASSWORD')
def releaseSigningValues = [
    releaseStoreFilePath,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
]
def hasAnyReleaseSigningValue = releaseSigningValues.any { it }
def hasReleaseSigning = releaseSigningValues.every { it }
def allowDebugReleaseSigning =
    (releaseSigningValue('ALLOW_DEBUG_RELEASE_SIGNING') ?: 'false').toBoolean()

// ABIs packaged into release builds. Default arm64-v8a covers the vast majority
// of modern Android devices and keeps the APK small (~1/3 of a full multi-ABI
// build). Override per build via ALIANG_ABI_FILTERS (comma-separated), e.g.
// "arm64-v8a,armeabi-v7a,x86_64,x86" for a full universal APK. Only applied to
// release tasks; debug keeps every ABI for emulators. Set on defaultConfig
// (not buildType) so it reliably drives mergeNativeLibs/packageApp inputs and
// invalidates the UP-TO-DATE cache when the value changes.
def isReleaseTask = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}
def releaseAbiFilters = isReleaseTask
    ? ((releaseSigningValue('ALIANG_ABI_FILTERS') ?: 'arm64-v8a')
        .split(',').collect { it.trim() }.findAll { it })
    : []
// ndk.abiFilters restricts which ABIs CMake compiles (faster builds), but in
// this AGP version it does NOT strip prebuilt .so bundled in AAR dependencies
// during mergeNativeLibs — they still land in the APK. packaging.jniLibs.excludes
// is the reliable strip: exclude every lib/<abi>/* NOT in the requested set.
// (Empty for debug → keep all ABIs for emulators.)
def ALL_ABIS = ['arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86', 'mips', 'mips64']
def excludedAbis = isReleaseTask ? (ALL_ABIS - releaseAbiFilters) : []

if (hasAnyReleaseSigningValue && !hasReleaseSigning) {
    throw new GradleException(
        'Android release signing is partially configured. Set all ALIANG_RELEASE_* values.',
    )
}
if (
    gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } &&
    !hasReleaseSigning &&
    !allowDebugReleaseSigning
) {
    throw new GradleException(
        'Release signing is required. Configure ALIANG_RELEASE_STORE_FILE, ' +
        'ALIANG_RELEASE_STORE_PASSWORD, ALIANG_RELEASE_KEY_ALIAS and ' +
        'ALIANG_RELEASE_KEY_PASSWORD. For an internal-only test APK, explicitly ' +
        'set ALLOW_DEBUG_RELEASE_SIGNING=true.',
    )
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.aliangvibecodingphone"
    defaultConfig {
        applicationId "com.aliangvibecodingphone"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [usesCleartextTraffic: "true"]
        // Release-only ABI filter (see releaseAbiFilters). Empty for debug.
        ndk {
            if (releaseAbiFilters) abiFilters(*releaseAbiFilters)
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else if (allowDebugReleaseSigning) {
                // Explicit internal-testing escape hatch. Never use for distribution.
                signingConfig signingConfigs.debug
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

// ndk.abiFilters restricts which ABIs CMake compiles, but in this AGP version
// it does NOT strip prebuilt .so bundled in AAR dependencies (hermes/fbjni/jsi
// runtime libs) — they survive into the APK as dead weight (~30MB for the
// non-target ABIs). packaging.jniLibs.excludes doesn't catch them either (they
// arrive via prefab). So after mergeReleaseNativeLibs writes its output, delete
// the lib/<abi>/ dirs for every ABI not in the release filter. This runs before
// packaging+signing, so the final APK is signed once and is truly single-ABI.
// No-op for debug (excludedAbis is empty there).
if (isReleaseTask) {
    tasks.matching { it.name == 'mergeReleaseNativeLibs' }.configureEach {
        // The doLast below mutates the merged output (deletes lib/<abi>/ dirs).
        // Register the requested ABI set as a task input so switching filters
        // (arm64 → full → arm32 …) invalidates UP-TO-DATE and forces a fresh
        // re-merge — otherwise a later build reuses the previously-stripped
        // output and ships the wrong ABI set.
        inputs.property('aliangAbiFilter', releaseAbiFilters.join(','))
        doLast {
            if (!excludedAbis) return
            outputs.files.files.each { outFile ->
                def libDir = new File(outFile, 'lib')
                if (!libDir.exists()) return
                excludedAbis.each { abi ->
                    def d = new File(libDir, abi)
                    if (d.exists()) {
                        println "[aliang-abi] stripping merged lib/${abi}/ (${d.listFiles()?.length ?: 0} files)"
                        d.deleteDir()
                    }
                }
            }
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
